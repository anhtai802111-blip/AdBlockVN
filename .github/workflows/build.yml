name: Build AdBlock VN APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract AdBlock VN project
        run: |
          unzip -q AdBlockVN-v2-GitHub.zip -d project
          test -f project/AdBlockVN/settings.gradle.kts
          test -f project/AdBlockVN/app/build.gradle.kts

      - name: Build debug APK
        working-directory: project/AdBlockVN
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockVN-debug-apk
          path: project/AdBlockVN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
